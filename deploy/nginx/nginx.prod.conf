# Reverse proxy: mismo origen para front y API (recomendado en producción).
# Montar certificados TLS en /etc/nginx/certs/ y descomentar el bloque listen 443.

upstream consultorio_frontend {
  server frontend:80;
}

upstream consultorio_backend {
  server backend:8080;
}

server {
  listen 80;
  server_name _;

  # Redirigir HTTP a HTTPS cuando tengas certificados (descomentar en prod real):
  # return 301 https://$host$request_uri;

  location /consultorio/ {
    proxy_pass http://consultorio_backend/consultorio/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /actuator/ {
    proxy_pass http://consultorio_backend/actuator/;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://consultorio_frontend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

