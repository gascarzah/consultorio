# sudo cp ~/consultorio/deploy/nginx/gafah.dev.with-consultorios.conf /etc/nginx/sites-available/gafah.dev
# sudo nginx -t && sudo systemctl reload nginx

server {
    server_name gafah.dev;

    location /academias/ {
        proxy_pass http://127.0.0.1:3000/academias/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /condominios/ {
        proxy_pass http://127.0.0.1:3001/condominios/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /torneos {
        proxy_pass http://127.0.0.1:3003/torneos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /torneos/ {
        proxy_pass http://127.0.0.1:3003/torneos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /consultorio/ {
        proxy_pass http://127.0.0.1:8082/consultorio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /consultorios/ {
        alias /home/gafah/consultorio/frontend/;
        try_files $uri $uri/ /consultorios/index.html;
    }

    location = /consultorios {
        return 301 https://$host/consultorios/;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/gafah.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gafah.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = gafah.dev) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name gafah.dev;
    return 404;
}
