# Perfil producción (SPRING_PROFILES_ACTIVE=prod)
spring:
  jpa:
    show-sql: false
    hibernate:
      # Flyway ya aplicó el esquema; validate en 1 GB RAM puede tardar minutos.
      ddl-auto: none
  flyway:
    clean-disabled: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
